kind: wasmer.io/App.v0
name: Batik-Comp
description: Batik Nusantara storefront (Laravel + MySQL) on Wasmer Edge

env:
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: "https://batik-comp.wasmer.app"
  DB_CONNECTION: mysql
  DB_DATABASE: db_3facc609
  SESSION_DRIVER: cookie

capabilities:
  database:
    engine: mysql

locality:
  regions:
    - fr-roub1

scaling:
  mode: single_concurrency

jobs:
  - name: migrate-and-seed
    trigger: post-deployment
    action:
      execute:
        command: sh
        cli_args: ["-c", "rm -f /app/bootstrap/cache/config.php && DB_CONNECTION=mysql DB_DATABASE=db_3facc609 php /app/artisan migrate --seed --force --no-interaction 2>&1"]
        timeout: 5m

volumes:
  - name: uploads
    mount: /app/public/uploads
